name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/steer-gate-session-config]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check all library files
        run: find po06/lib -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Full po06 test suite
        run: node --test po06/test/*.test.mjs
